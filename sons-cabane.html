<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life RPG · sons de la cabane</title>
<style>
@font-face{font-family:Pixelify;src:url(fonts/pixelify.ttf)}
body{margin:0;min-height:100vh;background:#1a1222;color:#f3e3b0;font-family:Pixelify,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 18px;box-sizing:border-box}
h1{font-size:22px;margin:0;color:#f2c94c}
p{margin:0;opacity:.8;text-align:center;max-width:320px;line-height:1.4}
button{width:100%;max-width:320px;padding:18px 14px;font:inherit;font-size:18px;color:#1a1222;background:#ffd27a;border:3px solid #1a1222;box-shadow:0 0 0 2px #d9a35a,0 5px 0 2px #120c18;text-align:left;cursor:pointer}
button small{display:block;font-size:14px;opacity:.75;margin-top:4px}
button:active{transform:translateY(3px);box-shadow:0 0 0 2px #d9a35a,0 2px 0 2px #120c18}
a{color:#d9a35a}
</style></head><body>
<h1>Sons de la cabane</h1>
<p>Trois vraies vieilles portes en bois, enregistrées, avec un léger rendu 16 bits. Mets le son de l'iPhone (pas en silencieux).</p>
<button data-v="A">▶ Son 1 · Porte qui s'ouvre<small>Environ 1 s</small></button>
<button data-v="B">▶ Son 2 · Porte lente qui grince<small>Environ 1,2 s</small></button>
<button data-v="C">▶ Son 3 · Petit grincement de gond<small>Environ 0,8 s</small></button>
<p>Dis-moi ton numéro préféré.</p>
<p style="font-size:12px;opacity:.6">Sons : Kenney, « RPG Audio », licence CC0 (domaine public).</p>
<a href="./#fiche">‹ Retour à l'appli</a>
<script src="sons.js"></script>
<script>document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => playSound(SOUNDS.pixel.cabane[b.dataset.v])));</script>
</body></html>
